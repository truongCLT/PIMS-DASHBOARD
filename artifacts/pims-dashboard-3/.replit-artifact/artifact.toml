kind = "web"
previewPath = "/pims-dashboard-3/"
title = "PIMS Dashboard 3"
version = "1.0.0"
id = "artifacts/pims-dashboard-3"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pims-dashboard-3/" ]
localPort = 22239

[services.development]
run = "pnpm --filter @workspace/pims-dashboard-3 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pims-dashboard-3", "run", "build" ]
publicDir = "artifacts/pims-dashboard-3/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22239"
BASE_PATH = "/pims-dashboard-3/"
