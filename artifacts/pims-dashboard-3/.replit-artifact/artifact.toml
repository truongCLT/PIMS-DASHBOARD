kind = "web"
previewPath = "/pims-dashboard-3/"
title = "PIMS Dashboard 3"
description = "PIMS Dashboard 1의 복제본. 대우 E&C VINA 경영실적(매출·손익·수주·자금수지) 대시보드로, 동일한 API 서버 데이터를 사용하는 세 번째 대시보드 변형입니다."
version = "1.0.0"
id = "artifacts/pims-dashboard-3"
router = "path"

[[services]]
name = "web"
paths = [ "/pims-dashboard-3/" ]
localPort = 22239

[services.development]
run = "pnpm --filter @workspace/pims-dashboard-3 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pims-dashboard-3", "run", "build" ]
serve = "static"
publicDir = "artifacts/pims-dashboard-3/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22239"
BASE_PATH = "/pims-dashboard-3/"
