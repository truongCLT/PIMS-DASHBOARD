kind = "design-system"
previewPath = "/aqua-glass/"
title = "Aqua Glass"
description = "PIMS 대시보드용 새 디자인 시스템. 첨부된 세일즈 대시보드 컨셉(밝은 글래스모피즘, 아쿠아 블루→민트 그라디언트, 부드러운 필 형태 버튼, 네이비 텍스트)을 기반으로 한 라이트하고 산뜻한 스타일."
version = "1.0.0"
id = "artifacts/aqua-glass"
router = "path"

[[services]]
name = "web"
paths = [ "/aqua-glass/" ]
localPort = 18569

[services.development]
run = "pnpm --filter @workspace/aqua-glass run dev"

[services.env]
PORT = "18569"
BASE_PATH = "/aqua-glass/"
