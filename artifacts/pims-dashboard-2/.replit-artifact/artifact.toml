kind = "web"
previewPath = "/pims-dashboard-2/"
title = "PIMS Dashboard 2"
version = "1.0.0"
id = "artifacts/pims-dashboard-2"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pims-dashboard-2/" ]
localPort = 23700

[services.development]
run = "pnpm --filter @workspace/pims-dashboard-2 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pims-dashboard-2", "run", "build" ]
publicDir = "artifacts/pims-dashboard-2/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23700"
BASE_PATH = "/pims-dashboard-2/"
