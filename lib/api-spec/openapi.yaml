openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cashflow
    description: Cashflow (자금수지) operations
paths:
  /cashflow/projects:
    get:
      operationId: listCashflowProjects
      tags: [cashflow]
      summary: List cashflow projects
      responses:
        "200":
          description: Cashflow project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashflowProject"
  /cashflow/monthly:
    get:
      operationId: getCashflowMonthly
      tags: [cashflow]
      summary: Monthly cashflow series for a project
      parameters:
        - name: projectName
          in: query
          required: true
          schema:
            type: string
        - name: division
          in: query
          required: false
          schema:
            type: string
        - name: fromYear
          in: query
          required: true
          schema:
            type: integer
        - name: fromMonth
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        "200":
          description: Monthly cashflow series (cash in, cash out, cumulative balance) in 천 USD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashflowMonthlySeries"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /cashflow/aggregate:
    get:
      operationId: getCashflowAggregate
      tags: [cashflow]
      summary: Aggregated monthly cashflow series across projects (optionally by division)
      parameters:
        - name: division
          in: query
          required: false
          description: Single division name to aggregate. Mutually exclusive with divisions.
          schema:
            type: string
        - name: divisions
          in: query
          required: false
          description: Comma-separated list of division names to aggregate together. Mutually exclusive with division.
          schema:
            type: string
        - name: names
          in: query
          required: false
          description: Comma-separated cf_projects.name values to restrict the aggregation to
          schema:
            type: string
        - name: fromYear
          in: query
          required: true
          schema:
            type: integer
        - name: fromMonth
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        "200":
          description: Aggregated monthly cashflow series in 천 USD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashflowAggregateSeries"
        "404":
          description: No data for the requested scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ApiErrorMessage:
      type: object
      properties:
        error:
          type: string
      required: [error]
    CashflowProject:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        division:
          type: string
      required: [id, name, division]
    CashflowMonthlyPoint:
      type: object
      properties:
        month:
          type: string
          description: Month in YYYY-MM format
        cashIn:
          type: number
        cashOut:
          type: number
          description: Positive magnitude of outflow
        equivalent:
          type: number
          description: Cumulative balance (과부족 누계) up to and including this month
      required: [month, cashIn, cashOut, equivalent]
    CashflowMonthlySeries:
      type: object
      properties:
        projectName:
          type: string
        unit:
          type: string
          description: Amount unit (천 USD)
        points:
          type: array
          items:
            $ref: "#/components/schemas/CashflowMonthlyPoint"
      required: [projectName, unit, points]
    CashflowAggregateSeries:
      type: object
      properties:
        scope:
          type: string
          description: Aggregation scope label (전체 or division name)
        unit:
          type: string
          description: Amount unit (천 USD)
        points:
          type: array
          items:
            $ref: "#/components/schemas/CashflowMonthlyPoint"
      required: [scope, unit, points]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

