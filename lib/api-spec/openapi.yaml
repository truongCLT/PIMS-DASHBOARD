openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cashflow
    description: Cashflow (자금수지) operations
  - name: salescost
    description: Sales & Costs (매출/원가) operations
  - name: mgmtreport
    description: Management Report (경영관리보고회) operations
  - name: projectdetail
    description: Project detail (공정/원가/외주) operations
  - name: admin
    description: Admin authentication operations
  - name: fxrates
    description: FX rate (환율) operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Admin authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Log in with the admin password and receive a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /fxrates:
    get:
      operationId: getFxRates
      tags: [fxrates]
      summary: Current FX rates (1 USD 기준). Falls back to defaults when not set.
      responses:
        "200":
          description: FX rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRates"
    put:
      operationId: putFxRates
      tags: [fxrates]
      summary: Save FX rates (admin only)
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FxRates"
      responses:
        "200":
          description: Saved FX rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRates"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /fxrates/history:
    get:
      operationId: getFxRatesHistory
      tags: [fxrates]
      summary: Full monthly FX rate history (all currencies, all declared months)
      responses:
        "200":
          description: FX rate history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FxRateHistoryEntry"
    put:
      operationId: putFxRatesHistory
      tags: [fxrates]
      summary: Upsert one month's FX rate for one currency (admin only)
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FxRateHistoryEntry"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRateHistoryEntry"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /pimsvina/siterate:
    get:
      operationId: getPimsvinaSiterate
      tags: [pimsvinaRates]
      summary: PIMSVINA per-site contract exchange rate (CBTB_CTRTSUMM.RATEUSD/RATEKRW)
      parameters:
        - name: siteCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Site contract exchange rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PimsvinaSiteRate"
        "400":
          description: Missing siteCode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /pimsvina/exchangerate:
    get:
      operationId: getPimsvinaExchangerate
      tags: [pimsvinaRates]
      summary: PIMSVINA latest official monthly exchange rate (CHTB_EXCHANGE_RATIO)
      responses:
        "200":
          description: Latest official exchange rate entries (USD, KRW)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PimsvinaExchangeRateEntry"
  /orgstructure:
    get:
      operationId: getOrgStructure
      tags: [orgstructure]
      summary: Company/division org structure (companies with nested divisions)
      responses:
        "200":
          description: Org structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgStructure"
    put:
      operationId: putOrgStructure
      tags: [orgstructure]
      summary: Replace the whole companies/divisions tree (admin only)
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgStructureInput"
      responses:
        "200":
          description: Saved org structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgStructure"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/projects/{name}/division:
    patch:
      operationId: updateMgmtreportProjectDivision
      tags: [mgmtreport]
      summary: Assign a project to a division (admin only)
      security:
        - adminBearer: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMgmtreportProjectDivisionBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportProject"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/comments/{id}:
    patch:
      operationId: updateMgmtreportComment
      tags: [mgmtreport]
      summary: Update a comment body (admin only)
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMgmtreportComment"
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportComment"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
    delete:
      operationId: deleteMgmtreportComment
      tags: [mgmtreport]
      summary: Delete a comment (admin only)
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /projectdetail:
    get:
      operationId: getProjectdetail
      tags: [projectdetail]
      summary: Project detail data (progress, milestones, cost, outsourcing)
      parameters:
        - name: projectName
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project detail data (arrays may be empty when no data entered)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
    put:
      operationId: putProjectdetail
      tags: [projectdetail]
      summary: Replace all project detail data for a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDetail"
      responses:
        "200":
          description: Saved project detail data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /projectdetail/close:
    patch:
      operationId: patchProjectdetailClose
      tags: [projectdetail]
      summary: 프로젝트 데이터 편집 마감/해지 토글
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectName:
                  type: string
                closed:
                  type: boolean
                  description: true=마감, false=마감해지
              required: [projectName, closed]
      responses:
        "200":
          description: 마감 상태 변경 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectName:
                    type: string
                  isClosed:
                    type: boolean
                required: [projectName, isClosed]
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /projectdetail/comments:
    get:
      operationId: listProjectdetailComments
      tags: [projectdetail]
      summary: List comments for a project + tab (newest first)
      parameters:
        - name: projectName
          in: query
          required: true
          schema:
            type: string
        - name: tab
          in: query
          required: true
          schema:
            type: string
            enum: [overview, progress, costing, outsourcing, cashflow, saleprofit, budget, service]
      responses:
        "200":
          description: Comments (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectdetailCommentList"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
    post:
      operationId: createProjectdetailComment
      tags: [projectdetail]
      summary: Save a project detail tab comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectdetailComment"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectdetailComment"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /projectdetail/comments/{id}:
    patch:
      operationId: updateProjectdetailComment
      tags: [projectdetail]
      summary: Update a comment body (admin only)
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectdetailComment"
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectdetailComment"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
    delete:
      operationId: deleteProjectdetailComment
      tags: [projectdetail]
      summary: Delete a comment (admin only)
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /cashflow/projects:
    get:
      operationId: listCashflowProjects
      tags: [cashflow]
      summary: List cashflow projects
      responses:
        "200":
          description: Cashflow project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashflowProject"
  /cashflow/monthly:
    get:
      operationId: getCashflowMonthly
      tags: [cashflow]
      summary: Monthly cashflow series for a project
      parameters:
        - name: projectName
          in: query
          required: true
          schema:
            type: string
        - name: division
          in: query
          required: false
          schema:
            type: string
        - name: fromYear
          in: query
          required: true
          schema:
            type: integer
        - name: fromMonth
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 120
            default: 6
      responses:
        "200":
          description: Monthly cashflow series (cash in, cash out, cumulative balance) in 천 USD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashflowMonthlySeries"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /cashflow/aggregate:
    get:
      operationId: getCashflowAggregate
      tags: [cashflow]
      summary: Aggregated monthly cashflow series across projects (optionally by division)
      parameters:
        - name: division
          in: query
          required: false
          description: Single division name to aggregate. Mutually exclusive with divisions.
          schema:
            type: string
        - name: divisions
          in: query
          required: false
          description: Comma-separated list of division names to aggregate together. Mutually exclusive with division.
          schema:
            type: string
        - name: names
          in: query
          required: false
          description: Comma-separated cf_projects.name values to restrict the aggregation to
          schema:
            type: string
        - name: fromYear
          in: query
          required: true
          schema:
            type: integer
        - name: fromMonth
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        "200":
          description: Aggregated monthly cashflow series in 천 USD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashflowAggregateSeries"
        "404":
          description: No data for the requested scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /cashflow/import/preview:
    post:
      operationId: previewCashflowImport
      tags: [cashflow]
      summary: Parse an uploaded 자금수지 Excel and return a preview (no DB changes)
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Parsed preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashflowImportPreview"
        "400":
          description: Bad upload (missing file, too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "422":
          description: Excel format error (Korean message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /cashflow/import/apply:
    post:
      operationId: applyCashflowImport
      tags: [cashflow]
      summary: Parse an uploaded 자금수지 Excel and replace cashflow data in the DB
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Import applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashflowImportResult"
        "400":
          description: Bad upload (missing file, too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "422":
          description: Excel format error (Korean message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /salescost/import/preview:
    post:
      operationId: previewSalescostImport
      tags: [salescost]
      summary: Parse an uploaded 매출/원가 Excel and return a preview (no DB changes)
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                year:
                  type: integer
              required: [file, year]
      responses:
        "200":
          description: Parsed preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalescostImportPreview"
        "400":
          description: Bad upload (missing file, bad year, too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "422":
          description: Excel format error (Korean message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /salescost/import/apply:
    post:
      operationId: applySalescostImport
      tags: [salescost]
      summary: Parse an uploaded 매출/원가 Excel and replace salescost data in the DB
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                year:
                  type: integer
              required: [file, year]
      responses:
        "200":
          description: Import applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalescostImportResult"
        "400":
          description: Bad upload (missing file, bad year, too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "422":
          description: Excel format error (Korean message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /salescost/summary:
    get:
      operationId: getSalescostSummary
      tags: [salescost]
      summary: Company-wide monthly sales/costs summary (매출, 원가, 매출이익, 판관비, 영업이익)
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Monthly summary in 천 USD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalescostSummary"
        "404":
          description: No data for the requested year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /salescost/sites:
    get:
      operationId: listSalescostSites
      tags: [salescost]
      summary: Per-site monthly series for a metric
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: false
          description: One of revenue, cogs, repair_allowance, site_cost, hq_transfer, sga, employees
          schema:
            type: string
            enum: [revenue, cogs, repair_allowance, site_cost, hq_transfer, sga, employees]
            default: revenue
      responses:
        "200":
          description: Per-site monthly values in 천 USD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalescostSites"
        "404":
          description: No data for the requested year/metric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/summary:
    get:
      operationId: getMgmtreportSummary
      tags: [mgmtreport]
      summary: Corporate P&L lines (수주~경상이익), plan vs actual monthly series, for every year with data
      responses:
        "200":
          description: Corporate P&L lines in 천 USD, one entry per year
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MgmtreportSummary"
  /mgmtreport/projects:
    get:
      operationId: listMgmtreportProjects
      tags: [mgmtreport]
      summary: Per-project plan vs actual monthly revenue/cogs series and annual outlook
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: includeGroups
          in: query
          required: false
          description: Include corporate rollup rows (DECV법인 취합본)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Per-project series in 천 USD. Monthly figures are zero-filled when the year has no data yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportProjects"
  /mgmtreport/projects/status:
    put:
      operationId: updateMgmtreportProjectStatus
      tags: [mgmtreport]
      summary: Update a project's progress status (ongoing/closed). Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MgmtreportProjectStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportProjectStatusUpdate"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/import/preview:
    post:
      operationId: previewMgmtreportImport
      tags: [mgmtreport]
      summary: Parse an uploaded 경영관리보고회 Excel and return a preview (no DB changes)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                year:
                  type: integer
              required: [file, year]
      responses:
        "200":
          description: Parsed preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportImportPreview"
        "400":
          description: Bad upload (missing file, bad year, too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "422":
          description: Excel format error (Korean message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/import/apply:
    post:
      operationId: applyMgmtreportImport
      tags: [mgmtreport]
      summary: Parse an uploaded 경영관리보고회 Excel and replace mgmtreport data in the DB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                year:
                  type: integer
              required: [file, year]
      responses:
        "200":
          description: Import applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportImportResult"
        "400":
          description: Bad upload (missing file, bad year, too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "422":
          description: Excel format error (Korean message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/import/history:
    get:
      operationId: listMgmtreportImportHistory
      tags: [mgmtreport]
      summary: List recent 경영관리보고회 Excel apply history (admin)
      security:
        - adminBearer: []
      responses:
        "200":
          description: Recent apply history, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportImportHistoryList"
        "401":
          description: Admin auth required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/import/revert:
    post:
      operationId: revertMgmtreportImport
      tags: [mgmtreport]
      summary: Restore mgmtreport data to the snapshot taken before the selected apply (admin)
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertMgmtreportImport"
      responses:
        "200":
          description: Data restored to pre-apply snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportRevertResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "404":
          description: History entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "422":
          description: Snapshot cannot be restored (e.g. empty pre-apply state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/comments:
    get:
      operationId: listMgmtreportComments
      tags: [mgmtreport]
      summary: List saved 실적/전망 comments for a year+month
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: section
          in: query
          required: false
          description: Filter by section (analysis=실적, outlook=전망)
          schema:
            type: string
            enum: [analysis, outlook]
      responses:
        "200":
          description: Comments (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportCommentList"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
    post:
      operationId: createMgmtreportComment
      tags: [mgmtreport]
      summary: Save a 실적/전망 comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMgmtreportComment"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportComment"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
  schemas:
    AdminLoginBody:
      type: object
      properties:
        password:
          type: string
          minLength: 1
      required: [password]
    AdminLoginResult:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          description: ISO timestamp when the token expires
      required: [token, expiresAt]
    FxRates:
      type: object
      description: 환율 (1 USD 기준)
      properties:
        usd:
          type: number
          exclusiveMinimum: 0
        krw:
          type: number
          exclusiveMinimum: 0
        vnd:
          type: number
          exclusiveMinimum: 0
      required: [usd, krw, vnd]
    FxRateHistoryEntry:
      type: object
      description: 특정 통화·연·월의 환율 (1 USD 기준)
      properties:
        currency:
          type: string
          enum: [USD, KRW, VND]
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        rate:
          type: number
          exclusiveMinimum: 0
      required: [currency, year, month, rate]
    PimsvinaSiteRate:
      type: object
      description: PIMSVINA 현장 계약 환율 (CBTB_CTRTSUMM.RATEUSD/RATEKRW, VND 기준)
      properties:
        siteCode:
          type: string
        rateUsd:
          type: number
          nullable: true
          description: 1 USD 당 VND (RATEUSD)
        rateKrw:
          type: number
          nullable: true
          description: 1 KRW 당 VND (RATEKRW)
      required: [siteCode, rateUsd, rateKrw]
    PimsvinaExchangeRateEntry:
      type: object
      description: PIMSVINA 공식 환율 중 조회 시점 기준 최신 월 값 (CHTB_EXCHANGE_RATIO, VND 기준)
      properties:
        currency:
          type: string
          enum: [USD, KRW]
        yymm:
          type: string
          description: 환율이 존재하는 최신 월 (YYYYMM)
        rate:
          type: number
          description: 1 currency 당 VND
      required: [currency, yymm, rate]
    Division:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        label:
          type: string
        businessType:
          type: string
          enum: [시공, 용역]
        sortOrder:
          type: integer
      required: [id, companyId, label, businessType, sortOrder]
    Company:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        sortOrder:
          type: integer
        divisions:
          type: array
          items:
            $ref: "#/components/schemas/Division"
      required: [id, label, sortOrder, divisions]
    OrgStructure:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: "#/components/schemas/Company"
      required: [companies]
    DivisionInput:
      type: object
      properties:
        label:
          type: string
        businessType:
          type: string
          enum: [시공, 용역]
        sortOrder:
          type: integer
      required: [label, businessType, sortOrder]
    CompanyInput:
      type: object
      properties:
        label:
          type: string
        sortOrder:
          type: integer
        divisions:
          type: array
          items:
            $ref: "#/components/schemas/DivisionInput"
      required: [label, sortOrder, divisions]
    OrgStructureInput:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: "#/components/schemas/CompanyInput"
      required: [companies]
    UpdateMgmtreportProjectDivisionBody:
      type: object
      properties:
        divisionId:
          type: integer
          nullable: true
          description: null이면 매핑 해제 (기존 키워드 추정 방식으로 폴백)
      required: [divisionId]
    ProjectdetailComment:
      type: object
      properties:
        id:
          type: integer
