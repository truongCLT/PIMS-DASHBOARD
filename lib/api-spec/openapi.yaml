      required: [name, isGroup, revenuePlan, revenueActual, cogsPlan, cogsActual, annual, hasPimsvinaDetail]
    MgmtreportProjects:
      type: object
      properties:
        year:
          type: integer
        unit:
          type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/MgmtreportProject"
      required: [year, unit, projects]
    ProjectDetailOverview:
      type: object
      properties:
        siteCode:
          type: string
          nullable: true
          description: PIMSVINA 현장 코드 (mr_projects.site_code), 현장 계약 환율 조회에 사용
        contractAmount:
          type: number
          nullable: true
          description: 도급액 (천 USD)
        startDate:
          type: string
          nullable: true
          description: 공사 시작일 YYYY-MM-DD
        endDate:
          type: string
