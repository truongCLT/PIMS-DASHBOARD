openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cashflow
    description: Cashflow (자금수지) operations
  - name: salescost
    description: Sales & Costs (매출/원가) operations
  - name: mgmtreport
    description: Management Report (경영관리보고회) operations
  - name: projectdetail
    description: Project detail (공정/원가/외주) operations
paths:
  /projectdetail:
    get:
      operationId: getProjectdetail
      tags: [projectdetail]
      summary: Project detail data (progress, milestones, cost, outsourcing)
      parameters:
        - name: projectName
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project detail data (arrays may be empty when no data entered)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
    put:
      operationId: putProjectdetail
      tags: [projectdetail]
      summary: Replace all project detail data for a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDetail"
      responses:
        "200":
          description: Saved project detail data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /cashflow/projects:
    get:
      operationId: listCashflowProjects
      tags: [cashflow]
      summary: List cashflow projects
      responses:
        "200":
          description: Cashflow project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashflowProject"
  /cashflow/monthly:
    get:
      operationId: getCashflowMonthly
      tags: [cashflow]
      summary: Monthly cashflow series for a project
      parameters:
        - name: projectName
          in: query
          required: true
          schema:
            type: string
        - name: division
          in: query
          required: false
          schema:
            type: string
        - name: fromYear
          in: query
          required: true
          schema:
            type: integer
        - name: fromMonth
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        "200":
          description: Monthly cashflow series (cash in, cash out, cumulative balance) in 천 USD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashflowMonthlySeries"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /cashflow/aggregate:
    get:
      operationId: getCashflowAggregate
      tags: [cashflow]
      summary: Aggregated monthly cashflow series across projects (optionally by division)
      parameters:
        - name: division
          in: query
          required: false
          description: Single division name to aggregate. Mutually exclusive with divisions.
          schema:
            type: string
        - name: divisions
          in: query
          required: false
          description: Comma-separated list of division names to aggregate together. Mutually exclusive with division.
          schema:
            type: string
        - name: names
          in: query
          required: false
          description: Comma-separated cf_projects.name values to restrict the aggregation to
          schema:
            type: string
        - name: fromYear
          in: query
          required: true
          schema:
            type: integer
        - name: fromMonth
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        "200":
          description: Aggregated monthly cashflow series in 천 USD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashflowAggregateSeries"
        "404":
          description: No data for the requested scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /salescost/summary:
    get:
      operationId: getSalescostSummary
      tags: [salescost]
      summary: Company-wide monthly sales/costs summary (매출, 원가, 매출이익, 판관비, 영업이익)
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Monthly summary in 천 USD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalescostSummary"
        "404":
          description: No data for the requested year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /salescost/sites:
    get:
      operationId: listSalescostSites
      tags: [salescost]
      summary: Per-site monthly series for a metric
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: false
          description: One of revenue, cogs, repair_allowance, site_cost, hq_transfer, sga, employees
          schema:
            type: string
            enum: [revenue, cogs, repair_allowance, site_cost, hq_transfer, sga, employees]
            default: revenue
      responses:
        "200":
          description: Per-site monthly values in 천 USD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalescostSites"
        "404":
          description: No data for the requested year/metric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/summary:
    get:
      operationId: getMgmtreportSummary
      tags: [mgmtreport]
      summary: Corporate P&L lines (수주~경상이익), plan vs actual monthly series
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Corporate P&L lines in 천 USD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportSummary"
        "404":
          description: No data for the requested year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/projects:
    get:
      operationId: listMgmtreportProjects
      tags: [mgmtreport]
      summary: Per-project plan vs actual monthly revenue/cogs series and annual outlook
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: includeGroups
          in: query
          required: false
          description: Include corporate rollup rows (DECV법인 취합본)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Per-project series in 천 USD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportProjects"
        "404":
          description: No data for the requested year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/import/preview:
    post:
      operationId: previewMgmtreportImport
      tags: [mgmtreport]
      summary: Parse an uploaded 경영관리보고회 Excel and return a preview (no DB changes)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                year:
                  type: integer
              required: [file, year]
      responses:
        "200":
          description: Parsed preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportImportPreview"
        "400":
          description: Bad upload (missing file, bad year, too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "422":
          description: Excel format error (Korean message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/import/apply:
    post:
      operationId: applyMgmtreportImport
      tags: [mgmtreport]
      summary: Parse an uploaded 경영관리보고회 Excel and replace mgmtreport data in the DB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                year:
                  type: integer
              required: [file, year]
      responses:
        "200":
          description: Import applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportImportResult"
        "400":
          description: Bad upload (missing file, bad year, too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "422":
          description: Excel format error (Korean message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /mgmtreport/comments:
    get:
      operationId: listMgmtreportComments
      tags: [mgmtreport]
      summary: List saved 실적/전망 comments for a year+month
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: section
          in: query
          required: false
          description: Filter by section (analysis=실적, outlook=전망)
          schema:
            type: string
            enum: [analysis, outlook]
      responses:
        "200":
          description: Comments (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportCommentList"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
    post:
      operationId: createMgmtreportComment
      tags: [mgmtreport]
      summary: Save a 실적/전망 comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMgmtreportComment"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtreportComment"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    MgmtreportComment:
      type: object
      properties:
        id:
          type: integer
        year:
          type: integer
        month:
          type: integer
        section:
          type: string
          enum: [analysis, outlook]
        body:
          type: string
        createdAt:
          type: string
      required: [id, year, month, section, body, createdAt]
    MgmtreportCommentList:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/MgmtreportComment"
      required: [comments]
    CreateMgmtreportComment:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        section:
          type: string
          enum: [analysis, outlook]
        body:
          type: string
          minLength: 1
          maxLength: 2000
      required: [year, month, section, body]
    MgmtreportImportProjectPreview:
      type: object
      properties:
        name:
          type: string
        siteCode:
          type: [string, "null"]
        isGroup:
          type: boolean
        revenueActualTotal:
          type: number
        cogsActualTotal:
          type: number
        monthlyCount:
          type: integer
      required: [name, siteCode, isGroup, revenueActualTotal, cogsActualTotal, monthlyCount]
    MgmtreportImportPreview:
      type: object
      properties:
        year:
          type: integer
        unit:
          type: string
        projectCount:
          type: integer
        monthlyCount:
          type: integer
        annualCount:
          type: integer
        pnlCount:
          type: integer
        monthsWithActual:
          type: array
          items:
            type: integer
        totals:
          type: object
          properties:
            revenuePlan:
              type: number
            revenueActual:
              type: number
            cogsActual:
              type: number
          required: [revenuePlan, revenueActual, cogsActual]
        projects:
          type: array
          items:
            $ref: "#/components/schemas/MgmtreportImportProjectPreview"
      required:
        [year, unit, projectCount, monthlyCount, annualCount, pnlCount, monthsWithActual, totals, projects]
    MgmtreportImportResult:
      allOf:
        - $ref: "#/components/schemas/MgmtreportImportPreview"
        - type: object
          properties:
            applied:
              type: boolean
          required: [applied]
    ApiErrorMessage:
      type: object
      properties:
        error:
          type: string
      required: [error]
    CashflowProject:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        division:
          type: string
      required: [id, name, division]
    CashflowMonthlyPoint:
      type: object
      properties:
        month:
          type: string
          description: Month in YYYY-MM format
        cashIn:
          type: number
        cashOut:
          type: number
          description: Positive magnitude of outflow
        equivalent:
          type: number
          description: Cumulative balance (과부족 누계) up to and including this month
      required: [month, cashIn, cashOut, equivalent]
    CashflowMonthlySeries:
      type: object
      properties:
        projectName:
          type: string
        unit:
          type: string
          description: Amount unit (천 USD)
        points:
          type: array
          items:
            $ref: "#/components/schemas/CashflowMonthlyPoint"
      required: [projectName, unit, points]
    CashflowAggregateSeries:
      type: object
      properties:
        scope:
          type: string
          description: Aggregation scope label (전체 or division name)
        unit:
          type: string
          description: Amount unit (천 USD)
        points:
          type: array
          items:
            $ref: "#/components/schemas/CashflowMonthlyPoint"
      required: [scope, unit, points]
    SalescostSummaryPoint:
      type: object
      properties:
        month:
          type: integer
          description: Month number 1..12
        revenue:
          type: number
        cogs:
          type: number
        grossProfit:
          type: number
          description: revenue - cogs
        sga:
          type: number
          description: 판관비 (S&A expenses)
        operatingProfit:
          type: number
          description: grossProfit - sga
      required: [month, revenue, cogs, grossProfit, sga, operatingProfit]
    SalescostSummary:
      type: object
      properties:
        year:
          type: integer
        unit:
          type: string
          description: Amount unit (천 USD)
        points:
          type: array
          items:
            $ref: "#/components/schemas/SalescostSummaryPoint"
      required: [year, unit, points]
    SalescostSiteSeries:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        category:
          type: string
          nullable: true
        bizType:
          type: string
          nullable: true
        months:
          type: array
          description: 12 values, index 0 = January
          items:
            type: number
        total:
          type: number
      required: [code, name, months, total]
    SalescostSites:
      type: object
      properties:
        year:
          type: integer
        metric:
          type: string
        unit:
          type: string
        sites:
          type: array
          items:
            $ref: "#/components/schemas/SalescostSiteSeries"
      required: [year, metric, unit, sites]
    MgmtreportLine:
      type: object
      properties:
        code:
          type: string
          description: Line code (new_orders, order_profit, revenue, cogs, gross_profit, sga, op_profit1, op_profit2, finance_cost, interest_income, ordinary_profit, ...)
        label:
          type: string
          description: Original Korean label
        plan:
          type: array
          description: 12 monthly plan values, index 0 = January
          items:
            type: number
        actual:
          type: array
          description: 12 monthly actual/forecast values, index 0 = January
          items:
            type: number
        planTotal:
          type: number
        actualTotal:
          type: number
      required: [code, label, plan, actual, planTotal, actualTotal]
    MgmtreportSummary:
      type: object
      properties:
        year:
          type: integer
        unit:
          type: string
          description: Amount unit (천 USD)
        lines:
          type: array
          items:
            $ref: "#/components/schemas/MgmtreportLine"
      required: [year, unit, lines]
    MgmtreportAnnualPoint:
      type: object
      properties:
        year:
          type: integer
        scenario:
          type: string
          description: actual (전년 실적) or forecast (전망)
        revenue:
          type: number
        cogs:
          type: number
      required: [year, scenario, revenue, cogs]
    MgmtreportProject:
      type: object
      properties:
        name:
          type: string
        siteCode:
          type: string
          nullable: true
        isGroup:
          type: boolean
          description: True for corporate rollup rows (DECV법인 취합본)
        revenuePlan:
          type: array
          items:
            type: number
        revenueActual:
          type: array
          items:
            type: number
        cogsPlan:
          type: array
          items:
            type: number
        cogsActual:
          type: array
          items:
            type: number
        annual:
          type: array
          items:
            $ref: "#/components/schemas/MgmtreportAnnualPoint"
      required: [name, isGroup, revenuePlan, revenueActual, cogsPlan, cogsActual, annual]
    MgmtreportProjects:
      type: object
      properties:
        year:
          type: integer
        unit:
          type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/MgmtreportProject"
      required: [year, unit, projects]
    ProjectDetailOverview:
      type: object
      properties:
        contractAmount:
          type: number
          nullable: true
          description: 도급액 (천 USD)
        startDate:
          type: string
          nullable: true
          description: 공사 시작일 YYYY-MM-DD
        endDate:
          type: string
          nullable: true
          description: 공사 종료일 YYYY-MM-DD
      required: [contractAmount, startDate, endDate]
    ProjectDetailProgressPoint:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        planPct:
          type: number
          nullable: true
        actualPct:
          type: number
          nullable: true
        planCumPct:
          type: number
          nullable: true
        actualCumPct:
          type: number
          nullable: true
      required: [year, month]
    ProjectDetailMilestone:
      type: object
      properties:
        label:
          type: string
        planStart:
          type: string
          nullable: true
          description: YYYY-MM
        planEnd:
          type: string
          nullable: true
        actualStart:
          type: string
          nullable: true
        actualEnd:
          type: string
          nullable: true
      required: [label]
    ProjectDetailCostEstimation:
      type: object
      properties:
        kind:
          type: string
          enum: [bidding, execution, completion]
        contractAmount:
          type: number
          nullable: true
        costAmount:
          type: number
          nullable: true
      required: [kind]
    ProjectDetailCostBudget:
      type: object
      properties:
        category:
          type: string
          nullable: true
        item:
          type: string
        budget:
          type: number
          nullable: true
        plan:
          type: number
          nullable: true
        actual:
          type: number
          nullable: true
      required: [item]
    ProjectDetailOutsourcing:
      type: object
      properties:
        trade:
          type: string
        vendor:
          type: string
          nullable: true
        contractDate:
          type: string
          nullable: true
        changeNo:
          type: string
          nullable: true
        budget:
          type: number
          nullable: true
        resolved:
          type: number
          nullable: true
        thisMonth:
          type: number
          nullable: true
        accum:
          type: number
          nullable: true
      required: [trade]
    ProjectDetail:
      type: object
      properties:
        projectName:
          type: string
        unit:
          type: string
          description: Amount unit (천 USD)
        overview:
          $ref: "#/components/schemas/ProjectDetailOverview"
        progress:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDetailProgressPoint"
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDetailMilestone"
        costEstimation:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDetailCostEstimation"
        costBudget:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDetailCostBudget"
        outsourcing:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDetailOutsourcing"
      required: [projectName, unit, overview, progress, milestones, costEstimation, costBudget, outsourcing]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

