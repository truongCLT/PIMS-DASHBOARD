          type: array
          items:
            type: number
        revenueActual:
          type: array
          items:
            type: number
        cogsPlan:
          type: array
          items:
            type: number
        cogsActual:
          type: array
          items:
            type: number
        annual:
          type: array
          items:
            $ref: "#/components/schemas/MgmtreportAnnualPoint"
